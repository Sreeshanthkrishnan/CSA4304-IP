<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechSavvy Shopping</title>
  <link rel="stylesheet" href="9.css">
</head>
<body>
  <header>
    <h1>TechSavvy</h1>
    <input id="search" placeholder="Search gadgets..." oninput="showProducts()">
    <button onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
  </header>

  <nav>
    <button onclick="filterProducts('All')">All</button>
    <button onclick="filterProducts('Smartphones')">Smartphones</button>
    <button onclick="filterProducts('Laptops')">Laptops</button>
    <button onclick="filterProducts('Tablets')">Tablets</button>
    <button onclick="filterProducts('Accessories')">Accessories</button>
  </nav>

  <h2>Popular Gadgets</h2>
  <main id="products"></main>

  <section>
    <h2>Shopping Cart</h2>
    <div id="cart"></div>
    <h3 id="total">Total: ₹0</h3>
    <input id="customer" placeholder="Enter your name">
    <button onclick="checkout()">Checkout</button>
  </section>

  <section>
    <h2>My Orders</h2>
    <div id="orders"></div>
  </section>

  <section>
    <h2>Admin - Manage Products</h2>
    <input id="pname" placeholder="Product name">
    <select id="pcategory">
      <option>Smartphones</option>
      <option>Laptops</option>
      <option>Tablets</option>
      <option>Accessories</option>
    </select>
    <input id="pprice" type="number" placeholder="Price">
    <input id="pdesc" placeholder="Description">
    <button onclick="addProduct()">Add Product</button>
    <div id="admin"></div>
  </section>

  <script src="9.js"></script>
</body>
</html>
