<!DOCTYPE html>
<html>
<head>
    <title>Train Reservation</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        h1 {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin: 20px;
        }

        input, select, button {
            padding: 8px;
            margin: 5px;
        }

        button {
            background-color: navy;
            color: white;
            border: none;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Train Reservation System</h1>

    <div class="box">
        <h2>Search Train</h2>

        From:
        <input type="text">

        To:
        <input type="text">

        Date:
        <input type="date">

        <button>Search</button>
    </div>

    <div class="box">
        <h2>Available Trains</h2>

        <table>
            <tr>
                <th>Train</th>
                <th>From</th>
                <th>To</th>
                <th>Seats</th>
            </tr>

            <tr>
                <td>Chennai Express</td>
                <td>Chennai</td>
                <td>Bangalore</td>
                <td>25</td>
            </tr>

            <tr>
                <td>Coimbatore Express</td>
                <td>Chennai</td>
                <td>Coimbatore</td>
                <td>15</td>
            </tr>
        </table>
    </div>

    <div class="box">
        <h2>Passenger Details</h2>

        Name:
        <input type="text">

        Age:
        <input type="number">

        Class:
        <select>
            <option>Sleeper</option>
            <option>AC</option>
        </select>

        <button>Book Ticket</button>
    </div>

    <div class="box">
        <h2>PNR Status</h2>

        <input type="text" placeholder="Enter PNR">

        <button>Check PNR</button>
    </div>

    <div class="box">
        <h2>Cancel Ticket</h2>

        <input type="text" placeholder="Enter PNR">

        <button>Cancel</button>
    </div>

</body>
</html>
