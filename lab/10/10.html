<!DOCTYPE html>
<html lang="en">
<head>
  <title>StyleHub Fashion Store</title>
  <link rel="stylesheet" href="10.css">
</head>
<body>
  <header>
    <h1>👗 StyleHub</h1>
    <input id="search" placeholder="Search fashion..." oninput="showProducts()">
    <button onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
  </header>

  <nav>
    <button onclick="filter('All')">All</button>
    <button onclick="filter('Men')">Men</button>
    <button onclick="filter('Women')">Women</button>
    <button onclick="filter('Children')">Children</button>
    <button onclick="filter('Footwear')">Footwear</button>
    <button onclick="filter('Accessories')">Accessories</button>
  </nav>

  <h2>Latest Fashion Collection</h2>
  <main id="products"></main>

  <section>
    <h2>Shopping Cart</h2>
    <div id="cart"></div>
    <h3 id="total">Total: ₹0</h3>
    <input id="customer" placeholder="Customer name">
    <button onclick="checkout()">Checkout</button>
  </section>

  <section>
    <h2>Order History</h2>
    <div id="orders"></div>
  </section>

  <section>
    <h2>Admin - Manage Products</h2>
    <input id="pname" placeholder="Product name">
    <select id="pcategory">
      <option>Men</option>
      <option>Women</option>
      <option>Children</option>
      <option>Footwear</option>
      <option>Accessories</option>
    </select>
    <input id="pprice" type="number" placeholder="Price">
    <input id="pdesc" placeholder="Description">
    <button onclick="addProduct()">Add Product</button>
    <div id="admin"></div>
  </section>

  <script src="10.js"></script>
</body>
</html>
